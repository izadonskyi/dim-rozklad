<title>DIM Розклад</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: темний сайдбар зліва, шапка з кроками, дошка викладача + права панель інших викладачів. Один світлий вигляд, як у чинній адмінці. */
:root{
  --side:#191919; --side-fg:#f3f1ea; --side-active:#f3ecdd; --lime:#d9f23c;

}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.35}

.app{min-height:100%}

.head{display:flex;align-items:center;gap:14px}
.menu{background:var(--side);color:var(--side-fg);border:0;border-radius:8px;padding:8px 12px;font-weight:600;display:flex;gap:8px;align-items:center}

.brand b{font-size:34px;font-weight:700;letter-spacing:-2px;line-height:1}

/* ---- легший дизайн панелі події ---- */
.pan .ps{border-top:0;padding:12px 0 2px;gap:4px;--tg:#eef1f6;--tc:#4a5468}
.pan .ps+.ps,.pan .ps+.genb{margin-top:4px}
.pan .s-th{--tg:#f1edfb;--tc:#6a4fb3}.pan .s-ln{--tg:#eaf2fd;--tc:#2f6db5}.pan .s-te{--tg:#fdf3e4;--tc:#9a6417}.pan .s-tx{--tg:#e9f7ef;--tc:#2e7d4f}
.pan .ps h3{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.2px;color:var(--fg);margin-bottom:4px}
.pan .ps h3::before{content:'';width:8px;height:8px;border-radius:3px;background:var(--tc);opacity:.75}
.pan .ps h4{display:inline-block;justify-self:start;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--tc);background:var(--tg);border-radius:6px;padding:2px 8px;margin-top:8px}
.pan .ps dl div{grid-template-columns:132px minmax(0,1fr);gap:8px;padding:3px 0;border-bottom:0}
.pan .ps dt{justify-self:start;font-size:11.5px;font-weight:600;color:var(--tc);background:var(--tg);border-radius:6px;padding:2px 8px;line-height:1.5}
.pan .ps dd{font-size:13.5px}
.pan .ef{border-color:transparent;background:transparent}
.pan .ef:hover{background:#f6f7f9}
.pan .ef:focus{background:var(--card);border-color:#cfd6e2}
.pan .ef.chg{background:#fff8e6;border-color:#f4dc9a}
.pan .genb{background:#f7f8fa;border:0}
.pan .genb h3{font-size:12.5px}
.pan .genb dt{font-size:11.5px}
.pan .genb dd{font-weight:500;font-size:12.5px;color:var(--fg)}
.txtot{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--tc);background:var(--tg);border-radius:99px;padding:1px 9px}
.txseg{display:flex;flex-wrap:wrap;gap:4px;background:#f4f5f7;border-radius:10px;padding:3px}
.txseg button{flex:1 1 auto;border:0;background:transparent;border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;color:var(--mute);cursor:pointer}
.txseg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(20,24,40,.12)}
.txseg button:disabled{opacity:.5;cursor:default}
.txh{font-size:11.5px;color:var(--mute);margin:4px 0 2px!important}
.txl{display:grid;gap:4px}
.txr{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;background:#fafbfc}
.txn{font-size:12.5px;font-weight:600;color:var(--tc);background:var(--tg);border-radius:6px;padding:1px 8px}
.txv{margin-left:auto;font-weight:600}
.txs{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.txs button,.txd{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;line-height:1;color:var(--fg)}

.txd{border-color:transparent;color:var(--faint)}.txd:hover{color:var(--bad)}
.txadd{justify-self:start;margin-top:4px;border:1px dashed #cfd6e2;background:transparent;border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px;color:var(--mute)}
@media(max-width:520px){.pan .ps dl div{grid-template-columns:1fr}}

/* квитки — легший вигляд */

.txseg{background:none;padding:0;gap:6px}

.txh{font-size:11px}

.txr{background:none;border-radius:0;padding:5px 2px;border-bottom:1px solid #f3f4f6}

.reqn{font-size:11.5px;color:var(--bad);background:#fdf1f1;border-radius:8px;padding:6px 10px;margin:2px 0 4px!important}
.drv{display:flex;align-items:center;gap:8px;margin:2px 0 4px}

.drvb:hover{background:var(--tg)}.drvb:disabled{opacity:.6;cursor:progress}
.drvo{font-size:12px;color:var(--link);text-decoration:none}
/* тихіший список публікації */
.prw2.bl{background:var(--card)}
.pst2 .w{color:var(--mute);font-weight:500;font-size:12px}
.pst2 .wm{border:1px dashed #e3c98d;color:#9a6f1c;border-radius:99px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.pdrv{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 10px;font:inherit;font-size:12px;color:#2f6db5;cursor:pointer;white-space:nowrap}
.pdrv:hover{background:#eaf2fd}.pdrv svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.drvrow{display:flex;align-items:center;gap:4px}

.drvi svg{width:15px;height:15px}

/* статуси публікації */
.pfl2{flex-wrap:wrap}
.ce.snt,.mc.snt{border:1.5px dotted currentColor;background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(20,24,40,.045) 7px 14px)}
.ce.snt::after{content:'очікує публікації';position:absolute;right:6px;bottom:4px;font-size:9.5px;font-weight:600;letter-spacing:.2px;opacity:.75}
.ce{position:relative}
.ptag.st.snt{background:#eef3fb;color:#2f6db5}
.pst2.k-sent{color:#2f6db5}.pst2.k-sent .dot{background:#2f6db5}
.pmvd{display:block;font-size:11.5px;color:var(--mute)}
.tconf{border-style:dashed!important;color:var(--mute)}
.pan.lock .ps,.pan.lock .genb,.pan.lock .pubbar{display:none!important}
.pklock{display:grid;gap:6px;background:#f6f7f9;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:13px}.pklock span{color:var(--mute);font-size:12.5px}.pklock div{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pkgrp{background:#eef3fb;color:#2f5f9c;border-radius:10px;padding:8px 12px;font-size:12.5px;margin:8px 0}
.stg{display:inline-block;font-style:normal;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.stg.rd{background:#fdf3e4;color:#9a6417}.stg.wt{background:#f1edfb;color:#6a4fb3}.stg.sn{background:#eaf2fd;color:#2f6db5}.stg.pb{background:#e9f7ef;color:#2e7d4f}.stg.up{background:#f3f4f6;color:var(--mute)}
.pst2 .stg+.pdrv,.pst2 .stg+.w{margin-left:6px}
.ce.wt,.mc.wt{border:1.5px dashed currentColor;opacity:.8}
.ce.wt::after{content:'в очікуванні';position:absolute;right:6px;bottom:4px;font-size:9.5px;font-weight:600;opacity:.75}
.ce.snt::after{content:'передано на публікацію'}
.ptag.st.wt{background:#f1edfb;color:#6a4fb3}
.prw2[data-a]{transition:background .12s,box-shadow .12s}
.prw2[data-a]:hover{background:#f7f9fc;box-shadow:inset 0 0 0 1px #e3e8f0}

.pgh2.cur{box-shadow:inset 0 0 0 2px var(--link)}
.sntp{display:inline-flex;align-items:center;gap:4px;position:relative}
.srev{display:inline-flex;align-items:center;justify-content:center;width:0;overflow:hidden;opacity:0;border:0;background:#fff;color:#2f6db5;border-radius:50%;height:18px;font-size:12px;cursor:pointer;transition:width .15s,opacity .15s;padding:0}
.sntp:hover .srev,.srev:focus{width:18px;opacity:1}

.cfc{display:inline-block;font-size:12px;font-weight:500;color:#a8452f;background:#fdf0ec;border-radius:8px;padding:3px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfd{display:block;font-size:11.5px;color:#a8452f;margin-top:1px}
.tcbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);background:#f6f7f9;border-radius:10px;padding:6px 10px;margin-bottom:8px}

/* ===== статуси подій у календарі ===== */
/* Додано на публікацію — біла, сіра пунктирна рамка, приглушений текст */
.ce.up,.mc.up{background:var(--card)!important;border:1.5px dashed #b9bfca!important;color:#6b7280!important;opacity:1!important;box-shadow:none!important}
.ce.up .who,.ce.up .loc,.ce.up b{color:#6b7280!important}
.ce.up::after{content:'＋ додано на публікацію';position:absolute;right:6px;bottom:4px;font-size:9.5px;font-weight:600;color:#9aa1ad}
.mc.up::before{content:'＋ ';font-weight:700;color:#9aa1ad}
/* В режимі очікування — без заливки, кольорова пунктирна рамка, кольоровий бокова смуга */
.ce.wt,.mc.wt{background:var(--card)!important;border:1.5px dashed currentColor!important;box-shadow:inset 4px 0 0 currentColor!important;opacity:1!important}
.ce.wt::after{content:'‖ в очікуванні'!important;position:absolute;right:6px;bottom:4px;font-size:9.5px;font-weight:700;opacity:.9!important}
.mc.wt::before{content:'‖ ';font-weight:700}
/* Передано в публікацію — заливка з густою штриховкою, суцільна рамка */
.ce.snt,.mc.snt{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.78) 0 5px,rgba(255,255,255,0) 5px 10px)!important;border:1.5px solid currentColor!important;opacity:1!important}
.ce.snt::after{content:'↗ передано в публікацію'!important;position:absolute;right:6px;bottom:4px;font-size:9.5px;font-weight:700;background:rgba(255,255,255,.9);border-radius:6px;padding:0 5px;opacity:1!important}
.mc.snt::before{content:'↗ ';font-weight:700}
/* Знято з публікації — сіра, закреслена */
.ce.unp,.mc.unp{background:#f3f4f6!important;color:#9aa1ad!important;border:1.5px solid #e2e5ea!important;filter:none!important;opacity:1!important}
.ce.unp b,.mc.unp{text-decoration:line-through}
.mc.unp::before{content:'✕ ';text-decoration:none;display:inline-block}
/* легенда */
.callg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:11.5px;color:var(--mute);margin:0 0 8px;padding:0 4px}
.callg span{display:inline-flex;align-items:center;gap:6px}
.callg i{display:inline-block;width:22px;height:12px;border-radius:4px}
.callg .l-pub{background:#dbe7fd}
.callg .l-up{background:#fff;border:1.5px dashed #b9bfca}
.callg .l-wt{background:#fff;border:1.5px dashed #2f55c9;box-shadow:inset 3px 0 0 #2f55c9}
.callg .l-snt{background:#dbe7fd repeating-linear-gradient(135deg,rgba(255,255,255,.78) 0 3px,rgba(255,255,255,0) 3px 6px);border:1.5px solid #2f55c9}
.callg .l-unp{background:#f3f4f6;border:1.5px solid #e2e5ea}

/* статус-підпис на картці — лише при наведенні */
.ce.up::after,.ce.wt::after,.ce.snt::after{opacity:0!important;transition:opacity .15s;left:auto;right:5px;bottom:auto;top:5px;text-align:center;background:var(--card)!important;border:1px solid var(--line);border-radius:99px;padding:1px 8px!important;white-space:nowrap;width:max-content;z-index:3;box-shadow:0 2px 6px rgba(20,24,40,.08)}
.ce.up:hover::after,.ce.wt:hover::after,.ce.snt:hover::after{opacity:1!important}
/* кнопка рівня паку */
.rb.pkbtn{background:var(--card)!important;color:#5b3fb0!important;border:1.5px solid #c9bdf0!important;display:inline-flex;align-items:center;gap:6px}
.rb.pkbtn:hover{background:#f4f0fd!important}
.rb.pkbtn:disabled{opacity:.5}
.rb.pkbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.pkeditb{margin:8px 0}

.pkpubn{font-size:12px;color:var(--mute)}
.medok{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#2e7d4f;background:#e9f7ef;border-radius:99px;padding:3px 10px;text-decoration:none;white-space:nowrap}

.medv{display:block;overflow:hidden;text-overflow:ellipsis}

.tch-h{display:flex!important;align-items:center;justify-content:space-between;gap:8px;width:100%}

const key=(s,w)=>s+'|'+add(S.start,w*7+SLOTS[s][1]);
const kdate=k=>k.split('|')[1], kmonth=k=>kdate(k).slice(0,7);
const works=(id,k)=>C().work[id].has(k);

const paired=(a,b)=>C().pairs.has(pk(a,b));
const partners=(id,k)=>C().teachers.filter(t=>t.id!==id&&paired(id,t.id)&&works(t.id,k)&&!evAt(t.id,k));
const partnerOf=(id,k)=>{const c=C(),m=c.wp||{},v=m[id+'|'+k];if(v!==undefined)return v&&works(v,k)?v:'';const p=partners(id,k)[0];return p?p.id:''};
const setPartner=(id,k,v)=>{const c=C();c.wp=c.wp||{};const old=partnerOf(id,k);if(old&&c.wp[old+'|'+k]===id)c.wp[old+'|'+k]='';c.wp[id+'|'+k]=v;if(v)c.wp[v+'|'+k]=id};
const weekCounts=id=>Array.from({length:S.weeks},(_,w)=>SLOTS.filter((_,s)=>works(id,key(s,w))).length);
const months=()=>{const m=new Set();for(let w=0;w<S.weeks;w++)for(let d=0;d<7;d++)m.add(add(S.start,w*7+d).slice(0,7));return [...m]};
const inRange=k=>{const d=kdate(k);return d>=S.start&&d<add(S.start,S.weeks*7)};
const plan=(t,m)=>C().plans[t+'|'+m]||0;
const used=(t,m)=>new Set(C().events.filter(e=>e.type===t&&kmonth(e.key)===m).map(e=>e.theme)).size;
const initials=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();

  document.getElementById('bar').innerHTML=
  `<div class="steps">${st.map((s,i)=>`<button data-a="step" data-v="${i+1}" class="${S.step===i+1?'on':''}" ${i===3?'disabled title="Ще не в прототипі"':''}><b>${i+1}</b>${s}</button>`).join('')}</div>
  <div class="seg"><button data-a="city" data-v="KYIV" class="${S.city==='KYIV'?'on':''}">Київ</button><button data-a="city" data-v="LVIV" class="${S.city==='LVIV'?'on':''}">Львів</button></div>
  <div class="rng"><button data-a="shift" data-v="-1" aria-label="Попередній тиждень">‹</button><span>${fmt(S.start)} – ${fmt(add(S.start,S.weeks*7-1))}</span><button data-a="shift" data-v="1" aria-label="Наступний тиждень">›</button></div>
  <select id="weeks" aria-label="Кількість тижнів">${[4,5,6].map(n=>`<option value="${n}" ${n===S.weeks?'selected':''}>${n} тижнів</option>`).join('')}</select>`;

function gridHead(){return `<thead><tr><th class="t"></th>${Array.from({length:S.weeks},(_,w)=>`<th>Тиждень ${w+1}<small>${fmt(add(S.start,w*7))}-${fmt(add(S.start,w*7+6))}</small></th>`).join('')}</tr></thead>`}
function mini(t){
  const me=cur(),isP=paired(me,t.id),wc=weekCounts(t.id);let shared=0,own=0;
  const rows=SLOTS.map((sl,s)=>`<tr><td>${sl[0]} ${sl[2]}</td>${Array.from({length:S.weeks},(_,w)=>{const k=key(s,w);const e=S.step===2&&evAt(t.id,k);
    if(e){if(e.owner===t.id)own++;return `<td class="evm c-${e.type}">${e.type}</td>`}
    if(!works(t.id,k))return '<td></td>';const sh=works(me,k);if(sh)shared++;return `<td class="${sh&&isP?'sh':'hatch lite'}"></td>`}).join('')}</tr>`).join('');
  return `<div class="mini ${isP?'pair':''}"><div class="mh"><b>${esc(t.name)}</b><button class="btn sm ${isP?'dark':''}" data-a="pair" data-v="${t.id}">${isP?'У парі ×':'Пара'}</button><button class="btn sm" data-a="cur" data-v="${t.id}">Змінити →</button></div>
  <div class="mm"><span>${wc.join('·')} = ${wc.reduce((a,b)=>a+b,0)}</span><b>${S.step===2?own+' власних занять':shared+' спільних з '+initials(name(me))}</b></div>
  <table><tr><th></th>${wc.map((_,w)=>`<th>т${w+1}</th>`).join('')}</tr>${rows}</table></div>`;
}
function panel(txt){return `<div class="col"><p class="cap">Інші викладачі</p><p class="help">${txt}</p>${C().teachers.filter(t=>t.id!==cur()).sort((a,b)=>paired(cur(),b.id)-paired(cur(),a.id)).map(mini).join('')}</div>`}

function step1(){
  const me=cur(),wc=weekCounts(me);
  const rows=SLOTS.map((sl,s)=>`<tr class="${s&&SLOTS[s-1][0]!==sl[0]?'gap':''}"><th class="t"><b>${sl[0]}</b>${sl[2].slice(0,5)}-${sl[3].slice(0,5)}<button data-a="clearrow" data-v="${s}" title="Прибрати цей час">×</button></th>${Array.from({length:S.weeks},(_,w)=>{const k=key(s,w),d=`<span class="d">${fmt(kdate(k))}</span>`;
    if(!works(me,k))return `<td data-k="${k}">${d}</td>`;const ev=evAt(me,k);
    if(ev){const o=ev.owner===me?ev.partner:ev.owner;return `<td class="hatch" data-k="${k}">${d}<span class="pw">${TYPES[ev.type]} · заплановано<b>${o?'з '+esc(name(o)):'соло'}</b></span></td>`}
    const p=partnerOf(me,k);
    return `<td class="hatch" data-k="${k}">${d}<span class="pw ${p?'':'solo'}">з ким<b>${p?esc(name(p)):'соло'}</b></span></td>`}).join('')}</tr>`).join('');
  return `<div class="body"><div class="col">
  <p class="help">Клікайте або тягніть по сітці, щоб позначити дати, коли ${esc(name(me))} працює. Ті самі дані — у панелі праворуч: там можна додати будь-який день, зняти окрему дату й обрати, з ким викладач працює.</p>
  <div class="row"><button class="btn" data-a="repeat">повторити тиждень 1 на весь період</button><button class="btn" data-a="clear">Очистити цього викладача</button></div>
  <div class="scroll"><table class="grid" id="paint">${gridHead()}<tbody>${rows}</tbody></table></div>
  </div>${tpanel(me,wc)}</div>`;
}
function tpanel(me,wc){
  const c=C(),daysOn=[...new Set(SLOTS.map((sl,s)=>[sl,s]).filter(([,s])=>Array.from({length:S.weeks},(_,w)=>works(me,key(s,w))).some(Boolean)).map(([sl])=>sl[1]))];
  const used=new Set(SLOTS.map((_,s)=>s).filter(s=>Array.from({length:S.weeks},(_,w)=>works(me,key(s,w))).some(Boolean)));
  const UK=['Пн','Вт','Ср','Чт','Пт','Сб'],UKF=['Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'];

    return `<div class="dc"><div class="dch"><b>${UK[d]}</b><span>${UKF[d].toLowerCase()} · ${n} ${n===1?'дата':'дат'}</span><button class="x" data-a="dday" data-v="${d}" title="Прибрати день" aria-label="Прибрати ${UKF[d]}">×</button></div>
    ${ss.map(([sl,s])=>`<div class="ts"><div class="tsh">${sl[2].slice(0,5)} – ${sl[3].slice(0,5)}<i>${Array.from({length:S.weeks},(_,w)=>works(me,key(s,w))).filter(Boolean).length}/${S.weeks} тиж.</i><button class="x" data-a="clearrow" data-v="${s}" title="Прибрати цей час" aria-label="Прибрати ${sl[2].slice(0,5)}">×</button></div>
      ${Array.from({length:S.weeks},(_,w)=>{const k=key(s,w),on=works(me,k),p=on?partnerOf(me,k):'',busy=evAt(me,k);
        const opts=c.teachers.filter(t=>t.id!==me&&works(t.id,k)&&(!evAt(t.id,k)||t.id===p));
        return `<div class="di ${on?'':'off'}"><label><input type="checkbox" data-wk="${k}" ${on?'checked':''} aria-label="Працює ${fmt(kdate(k))}">${fmt(kdate(k))}</label>
        ${busy?`<span class="bz">${TYPES[busy.type]} · вже заплановано</span>`:`<select data-wp="${k}" aria-label="З ким працює ${fmt(kdate(k))}"><option value="">соло</option>${opts.map(t=>`<option value="${t.id}" ${t.id===p?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`}</div>`}).join('')}</div>`).join('')}</div>`}).join('');
  const free=SLOTS.map((sl,s)=>[sl,s]).filter(([,s])=>!used.has(s));
  const groups=[0,1,2,3,4,5].map(d=>{const o=free.filter(([sl])=>sl[1]===d);return o.length?`<optgroup label="${UKF[d]}">${o.map(([sl,s])=>`<option value="${s}">${UK[d]} ${sl[2].slice(0,5)} – ${sl[3].slice(0,5)}</option>`).join('')}</optgroup>`:''}).join('');
  const others=c.teachers.filter(t=>t.id!==me);
  return `<aside class="tp" aria-label="Робочі години викладача"><div class="tph"><div class="who"><span class="ini">${initials(name(me))}</span>
  <select id="tsel" aria-label="Викладач">${c.teachers.map(t=>`<option value="${t.id}" ${t.id===me?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
  <div class="sum">${wc.map((n,w)=>`<div><b>${n}</b><small>т${w+1}</small></div>`).join('')}<div><b>${wc.reduce((a,b)=>a+b,0)}</b><small>разом</small></div></div></div>
  <div class="tpb"><p class="cap">Робочі дні</p>
  ${cards||'<div class="empty">Робочих днів ще немає. Додайте перший нижче.</div>'}
  <div class="add"><select id="adds" aria-label="День і час">${groups||'<option value="">усі слоти вже додано</option>'}</select><button class="btn dark" data-a="addslot" ${groups?'':'disabled'}>+ Додати день</button></div>
  <p class="cap">Пари</p><p class="help" style="font-size:12px">Пара підставляється за замовчуванням у поле «з ким».</p>
  <div class="chips2">${others.map(t=>`<button data-a="pair" data-v="${t.id}" class="${paired(me,t.id)?'on':''}" aria-pressed="${paired(me,t.id)}">${esc(t.name)}</button>`).join('')}</div>
  </div></aside>`;

function sess(e){return C().events.filter(x=>x.type===e.type&&x.theme===e.theme&&kmonth(x.key)===kmonth(e.key)).sort((a,b)=>kdate(a.key)<kdate(b.key)?-1:1).indexOf(e)+1}
function step2(){
  const me=cur(),c=C(),ms=months();
  const mine=c.events.filter(e=>inRange(e.key)&&(e.owner===me||e.partner===me));
  const cards=Object.keys(TYPES).map(t=>`<div class="type b-${t} ${S.brush===t?'on':''}" data-a="brush" data-v="${t}">
    <div class="top"><h3 class="f-${t}">${TYPES[t]}</h3><span><b>${mine.filter(e=>e.type===t).length}</b>ви берете участь</span></div>
    <div class="mo">${ms.map(m=>{const p=plan(t,m);return `<div class="${p?'':'none'}">${m}<b>${p?used(t,m)+'/'+p+' тем':'—'}</b>${S.plan===t?`<span class="pm"><button data-a="plan" data-v="${t}|${m}|-1" aria-label="Менше">−</button><button data-a="plan" data-v="${t}|${m}|1" aria-label="Більше">+</button></span>`:''}</div>`}).join('')}</div>
    <button class="btn sm" data-a="planopen" data-v="${t}">${S.plan===t?'готово':'план…'}</button></div>`).join('');
  const rows=SLOTS.map((sl,s)=>`<tr class="${s&&SLOTS[s-1][0]!==sl[0]?'gap':''}"><th class="t"><b>${sl[0]}</b>${sl[2]}-${sl[3]}</th>${Array.from({length:S.weeks},(_,w)=>{const k=key(s,w),e=evAt(me,k),dt=fmt(kdate(k));
    if(e){const other=e.owner===me?e.partner:e.owner,own=e.owner===me;
      const opts=own?[`<option value="">соло</option>`].concat(c.teachers.filter(t=>t.id!==me&&(t.id===e.partner||partners(me,k).includes(t))).map(t=>`<option value="${t.id}" ${t.id===e.partner?'selected':''}>${esc(t.name)}</option>`)).join(''):`<option>${esc(name(other))}</option>`;
      return `<td class="ev c-${e.type}"><span class="d">${dt}<span>T${e.theme}·${sess(e)}</span></span><h4>${TYPES[e.type]}</h4>
      <div class="ctl"><button data-a="theme" data-v="${k}|${e.owner}" title="Змінити тему" ${own?'':'disabled'}>T${e.theme}</button><select data-partner="${k}" aria-label="Партнер" ${own?'':'disabled'}>${opts}</select>${own?`<button data-a="del" data-v="${k}" title="Прибрати заняття">×</button>`:''}</div>
      <div class="own">власник: ${esc(name(e.owner))}</div></td>`}
    if(!works(me,k))return `<td class="off ro"><span class="d">${dt}</span><br>не працює</td>`;
    const p=partners(me,k);return `<td class="hatch ${p.length?'':'lite'}" data-a="draw" data-v="${k}"><span class="d">${dt}</span>${p.length?`<span class="p">можлива пара</span><span>${esc(p[0].name)}</span>`:'<span class="p">вільний слот</span>'}</td>`}).join('')}</tr>`).join('');
  const wsum=weekCounts(me).reduce((a,b)=>a+b,0);

    return u>=p?`<div class="note">${m} ${TYPES[t]}: усі ${p} тем плану відкриті. Підніміть план, щоб додати ще одну.</div>`:`<div class="note w">${m} ${TYPES[t]}: відкрито ${u} з ${p} тем плану — намалюйте заняття для решти.</div>`})).join('');
  return `<div class="body"><div class="col">
  <div class="tb"><span class="ini">${initials(name(me))}</span><h2>${esc(name(me))}</h2><div class="n"><b>${wsum}</b><small>працює</small></div><div class="n"><b>${mine.length}</b><small>намальовано</small></div><div class="n"><b>${mine.filter(e=>e.owner!==me).length}</b><small>з іншими</small></div></div>
  <div class="types">${cards}</div>
  <div class="scroll"><table class="grid">${gridHead()}<tbody>${rows}</tbody></table></div>
  <div class="legend"><span><i></i>не працює</span><span><i class="hatch lite"></i>вільний слот</span><span><i class="hatch"></i>вільно — тут вільна пара</span>${Object.keys(TYPES).map(t=>`<span><i class="c-${t}"></i>${TYPES[t]}</span>`).join('')}</div>
  <div class="stats"><div><b>${mine.length}</b>намальовано</div><div><b>${wsum}</b>робочих нагод</div><div><b>${mine.filter(e=>e.owner!==me).length}</b>подій з інших дошок</div><div><b>${mine.filter(e=>!e.partner).length}</b>проходять без пари</div></div>
  ${hints}</div>${panel(`Вікно всіх інших. Дошка ${esc(name(me))} — ліворуч; спільне заняття з'являється на обох одразу.`)}</div>`;
}
function themeRows(){
  const g={};C().events.filter(e=>e.type!=='OB'&&inRange(e.key)).forEach(e=>{const id=e.type+'|'+kmonth(e.key)+'|'+e.theme;(g[id]=g[id]||[]).push(e)});
  return Object.entries(g).map(([id,evs])=>{const[type,month,theme]=id.split('|');evs.sort((a,b)=>kdate(a.key)<kdate(b.key)?-1:1);return{id,type,month,theme:+theme,evs}}).sort((a,b)=>a.month.localeCompare(b.month)||a.theme-b.theme);
}

  <p class="help">One Band тут не заповнюються: вони не йдуть в Airtable.</p></div></div>`;
}

function calendar(){

  const opt=(list,val,lab,empty)=>`<option value="">${empty}</option>`+list.map(x=>`<option value="${esc(x.id)}" ${x.id===val?'selected':''}>${esc(lab(x))}</option>`).join('');
  const locs=R.locations.filter(l=>l.city===cn);
  const autoT=t=>{const em=(t.email||'').toLowerCase(),w=nWords(t.name);return R.teachers.find(x=>x.email&&x.email.toLowerCase()===em&&em)||R.teachers.find(x=>nWords(x.name)===w)};
  const E=DIM.exp||{total:0,waiting:0,done:0,errors:[]};
  const status=DIM.mode==='export'?(DIM.on?`<p class="dimst ok">Опубліковані джеми (Easy, Improv, Pro Cover, Voice, Special) автоматично передаються програмістам у форматі бекенду. <b>На сайті їх публікують програмісти</b> — адмінка нічого не змінює в базі сама.</p><p class="dimh">Передано: ${E.total} · чекають обробки: <b>${E.waiting}</b> · опубліковано програмістами: ${E.done}${E.errors.length?` · <span style="color:var(--bad)">помилок: ${E.errors.length}</span>`:''}</p>${E.errors.length?`<ul class="dimlog">${E.errors.slice(0,8).map(t=>`<li class="bad">${esc(t)}</li>`).join('')}</ul>`:''}`:`<p class="dimst bad">Немає підключення до сховища: ${esc(DIM.err||'перевірте Upstash у Vercel')}</p>`)
   :!DIM.token?'<p class="dimst bad">Не задано <b>DIM_API_TOKEN</b> у Vercel → Environment Variables.</p>':!DIM.on?`<p class="dimst bad">Токен є, але бекенд його не приймає: ${esc((R.errors||[])[0]||DIM.err||'невідома помилка')}</p>`:`<p class="dimst ok">Підключено до бекенду напряму. Опубліковані джеми створюються й оновлюються на сайті автоматично.</p>`;
  const nSync=Object.values(DIM.state).filter(x=>x.status==='ACTIVE').length;
  return `<div class="dlgw" data-a="dimno"><div class="dlg dimd" role="dialog" aria-modal="true" aria-labelledby="dimt" data-a="noop"><h3 id="dimt">Бекенд DIM</h3>${status}
  ${DIM.ref?`<details open><summary>Категорії</summary><div class="dimg">${DIM_TYPES.map(t=>`<label><span>${TYPES[t]}</span><select data-dim="cat:${t}">${opt(R.categories,(M.cat||{})[t],x=>x.name,'— авто —')}</select></label>`).join('')}</div></details>
  <details open><summary>Локація за замовчуванням · ${cn}</summary><div class="dimg"><label><span>${cn}</span><select data-dim="locDefault:${city}">${opt(locs,(M.locDefault||{})[city],x=>x.name,'— перша в місті —')}</select></label></div></details>
  <details open><summary>Викладачі · ${cn}</summary><p class="dimh">Підбираються автоматично за email, потім за іменем. Якщо «не знайдено» — оберіть вручну.</p><div class="dimg">${C().teachers.map(t=>{const a=autoT(t),v=(M.t||{})[`${city}:${t.id}`];return `<label><span>${esc(t.name)}</span><select data-dim="t:${city}:${t.id}">${opt(R.teachers,v,x=>x.name+(x.email?' · '+x.email:''),a?'авто: '+a.name:'— не знайдено —')}</select></label>`}).join('')}</div></details>`:''}
  ${DIM.log.length?`<details open><summary>Останні повідомлення</summary><ul class="dimlog">${DIM.log.map(x=>`<li class="${x.bad?'bad':''}">${esc(x.t)}</li>`).join('')}</ul></details>`:''}
  ${DIM.mode==='export'?'':`<p class="dimh">На бекенді зараз ${pl(nSync,'опублікований джем','опубліковані джеми','опублікованих джемів')} з адмінки.</p>`}
  <div class="dlgb"><button class="rb k" data-a="dimsync" ${DIM.on&&!DIM.busy?'':'disabled'}>${DIM.busy?'Передаю…':DIM.mode==='export'?'Передати зараз':'Синхронізувати зараз'}</button><button class="rb" data-a="dimno">Закрити</button></div></div></div>`}
async function dimSaveMap(){try{const r=await fetch('/api/dim',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'map',map:DIM.map})});if(!r.ok)throw 0;
  Object.values(DIM.state).forEach(x=>{if(x.status==='ACTIVE')x.hash='remap'});S.toast='Налаштування бекенду збережено.'}catch(e){S.toast='Не вдалося зберегти налаштування бекенду.'}render()}
document.addEventListener('change',ev=>{const t=ev.target;if(!t.dataset||!t.dataset.dim)return;const [kind,...rest]=t.dataset.dim.split(':'),k=rest.join(':'),M=DIM.map;M[kind]=M[kind]||{};if(t.value)M[kind][k]=t.value;else delete M[kind][k];dimSaveMap()});

document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('tset')){const sm=d.querySelector('summary');S.tsetOpen=d.open?sm.dataset.tset:(S.tsetOpen===sm.dataset.tset?null:S.tsetOpen)}},true);
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('gtech'))S.genOpen=d.open},true);
/* Зберігаємо прокрутку при кожному перемальовуванні */
(function(){const _r=render,keyOf=el=>{const c=(el.className&&typeof el.className==='string'?el.className.split(' ')[0]:'')||el.tagName;const same=[...document.querySelectorAll('#view '+(el.className&&typeof el.className==='string'&&el.className.split(' ')[0]?'.'+CSS.escape(el.className.split(' ')[0]):el.tagName))];return c+'#'+same.indexOf(el)};
  render=function(){const v=document.getElementById('view'),saved=[];if(v)v.querySelectorAll('*').forEach(el=>{if(el.scrollTop>0||el.scrollLeft>0)saved.push([keyOf(el),el.scrollTop,el.scrollLeft])});const wy=window.scrollY,wx=window.scrollX;
    _r.apply(this,arguments);
    saved.forEach(([k,t,l])=>{const[c,i]=k.split('#'),list=[...document.querySelectorAll('#view '+(/^[A-Z]+$/.test(c)?c:'.'+CSS.escape(c)))],el=list[+i];if(el){el.scrollTop=t;el.scrollLeft=l}});
    if(window.scrollY!==wy||window.scrollX!==wx)window.scrollTo(wx,wy)}})();
render();loadEmails().then(loadMake).then(dimLoad);
</script>
